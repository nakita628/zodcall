name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install (pnpm, as packageManager pins it)
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format, lint and type-check (Vite+ oxfmt, oxlint and tsc)
        run: pnpm check
      - name: Type-check every package (tsc --noEmit)
        run: pnpm typecheck
      - name: Test every package (Vitest)
        run: pnpm test
      - name: Build every package (vp pack)
        run: pnpm build
