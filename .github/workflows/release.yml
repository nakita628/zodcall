# Releases every package of the workspace whose version (packages/<name>/package.json) is not on
# npm yet, once CI has passed on main. `plan` reads the versions, asks the registry, and checks that
# each package's CHANGELOG.md (the format of changesets; it is the release note, there is no GitHub
# release) has the entry; then the commit is tagged `<directory>-v<version>` per package, the
# tarballs are built, and published with trusted publishing (OIDC, no token). Every step skips what
# is already done, so a run that failed part-way is finished by re-running its failed jobs. npm has
# no test registry: a manual run builds the chosen package(s) from the current ref and ends in a
# dry run, which prints what would be published.
#
# The packages are the list in `plan` (one directory under packages/ per line). The version is in
# package.json, as is the name on npm (the tag keeps the directory name, which is the same), and the
# tarball comes from `pnpm pack`, which replaces `workspace:*` with the versions. The jobs are matrices over that
# plan, so the publish job waits for every tag and every build: a package that fails to build holds
# the others back until the failed jobs are re-run, or the problem is fixed and pushed.
#
# `workflow_run` is the trigger zizmor warns about because it hands a token to code from a pull
# request when misused; `plan` checks out the commit CI ran on (`head_sha`), only for a `push` to
# main, and only the tag and publish jobs can write, through the API.
name: Release

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Package to build and dry-run publish
        type: choice
        default: all
        options:
          - all
          - zodcall
          - openapi-zodcall-client

permissions: {}

concurrency:
  group: release

jobs:
  plan:
    name: Plan the release
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      packages: ${{ steps.plan.outputs.packages }}
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Read the versions, ask npm, check the changelogs
        id: plan
        env:
          # The packages: one directory under packages/ per line. A new package is a new line here
          # (and in the dispatch choices above); a line starting with `#` is left out of the release.
          # A package is listed once it has a version and a CHANGELOG.md entry to publish.
          PACKAGES: |
            zodcall
            openapi-zodcall-client
          CHOSEN: ${{ inputs.package || 'all' }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          DISPATCH=false
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && DISPATCH=true
          PLANNED='[]'
          FAILED=false
          while read -r PACKAGE; do
            case "$PACKAGE" in '' | '#'*) continue ;; esac
            if [ "$CHOSEN" != "all" ] && [ "$CHOSEN" != "$PACKAGE" ]; then
              continue
            fi
            DIR="packages/$PACKAGE"
            NAME=$(jq -r .name "$DIR/package.json")
            VERSION=$(jq -r .version "$DIR/package.json")
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")
            case "$STATUS" in
              200) UNPUBLISHED=false ;;
              404) UNPUBLISHED=true ;;
              *)
                echo "::error::npm answered $STATUS for $NAME $VERSION. Check https://status.npmjs.org/ and re-run the workflow"
                FAILED=true
                continue
                ;;
            esac
            # The release note is the package's CHANGELOG.md: a version without an entry is not released.
            if ! grep -qx "## $VERSION" "$DIR/CHANGELOG.md"; then
              echo "::error file=$DIR/CHANGELOG.md::$NAME $VERSION has no '## $VERSION' entry in $DIR/CHANGELOG.md. Add one, then push again"
              FAILED=true
              continue
            fi
            echo "$DIR: $NAME $VERSION, unpublished=$UNPUBLISHED"
            PLANNED=$(jq -c --arg package "$PACKAGE" --arg name "$NAME" --arg version "$VERSION" --argjson unpublished "$UNPUBLISHED" \
              '. + [{package: $package, name: $name, version: $version, unpublished: $unpublished}]' <<< "$PLANNED")
          done <<< "$PACKAGES"
          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
          # What the build and publish jobs take: every package on a manual run, the unpublished ones otherwise.
          RELEASES=$(jq -c --argjson dispatch "$DISPATCH" '[ .[] | select($dispatch or .unpublished) ]' <<< "$PLANNED")
          {
            echo "packages=$PLANNED"
            echo "releases=$RELEASES"
          } >> "$GITHUB_OUTPUT"
          echo "releases: $(jq -r '[.[] | "\(.name) \(.version)"] | join(", ")' <<< "$RELEASES")"

  tag:
    name: Tag ${{ matrix.package }}
    needs: plan
    if: github.event_name == 'workflow_run' && needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - name: Create or verify tag
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
          NAME: ${{ matrix.name }}
          VERSION: ${{ matrix.version }}
          UNPUBLISHED: ${{ matrix.unpublished }}
          HEAD_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="$PACKAGE-v$VERSION"
          if ! TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null); then
            if [ "$UNPUBLISHED" = "false" ]; then
              echo "::error::$NAME $VERSION is already published, but tag $TAG does not exist. Tag the commit that was published (git tag $TAG <sha> && git push origin $TAG), or bump the version and push again"
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$HEAD_SHA" >/dev/null
            echo "created tag $TAG at $HEAD_SHA"
            exit 0
          fi
          if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
            echo "tag $TAG already points to $HEAD_SHA; skip"
            exit 0
          fi
          if [ "$UNPUBLISHED" = "false" ]; then
            echo "$NAME $VERSION is published and $TAG points to $TAG_SHA; nothing to do for $HEAD_SHA"
            exit 0
          fi
          # Not published, and tagged on an earlier commit of main: a run that tagged and then failed
          # to publish. Nothing went out under the tag, so it moves to the commit this run publishes.
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$TAG_SHA...$HEAD_SHA" --jq .status)
          if [ "$STATUS" = "ahead" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$HEAD_SHA" -F force=true >/dev/null
            echo "moved tag $TAG from $TAG_SHA to $HEAD_SHA: $NAME $VERSION was never published"
            exit 0
          fi
          echo "::error::$TAG already points to another commit ($TAG_SHA, expected $HEAD_SHA), which is not an ancestor of it. Re-run the release workflow for $TAG_SHA, or bump the version of packages/$PACKAGE and push again"
          exit 1

  build:
    name: Build ${{ matrix.package }}
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install (pnpm, as packageManager pins it)
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build the tarball (vp pack, pnpm pack)
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          pnpm --filter "./packages/$PACKAGE" run build
          TARBALLS=$(mktemp -d)
          pnpm --filter "./packages/$PACKAGE" pack --pack-destination "$TARBALLS"
          mkdir -p tarballs
          mv "$TARBALLS"/*.tgz tarballs/
          tar tzf tarballs/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.package }}
          path: tarballs
          if-no-files-found: error

  # On a manual run `tag` is skipped, hence `!cancelled()` and the results spelled out.
  publish:
    name: Publish ${{ matrix.name }} to npm
    needs: [plan, tag, build]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.releases != '[]' && needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.tag.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ matrix.name }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.package }}
          path: tarballs
      # npm 11.5+ publishes with trusted publishing (OIDC) and provenance, no token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Publish (trusted publishing, provenance)
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          npm --version
          # ./ makes it a file: npm reads a bare `tarballs/name.tgz` as the GitHub repository tarballs/name.tgz.
          for TARBALL in ./tarballs/*.tgz; do
            # shellcheck disable=SC2086
            npm publish "$TARBALL" --access public --provenance $DRY_RUN
          done
